# Render blueprint: the API and the dashboard as two services.
# New > Blueprint in Render, point it at this repo, then fill in the secrets
# it asks for. Docs: frontend/docs/GO-LIVE.md
services:
  - type: web
    name: dhwani-api
    runtime: node
    rootDir: frontend
    plan: free
    # Zero dependencies: nothing to install for the API.
    buildCommand: "true"
    startCommand: node server/index.mjs
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: PUBLIC_URL
        sync: false # https://dhwani-api.onrender.com (this service's URL)
      - key: CORS_ORIGINS
        sync: false # https://dhwani-dashboard.onrender.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BOLNA_API_KEY
        sync: false
      - key: BOLNA_SECRET
        generateValue: true
      - key: BOLNA_PHONE_NUMBER
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: STORE
        value: sheets

  - type: web
    name: dhwani-dashboard
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # https://dhwani-api.onrender.com
